# TEST-ONLY OVERRIDES. Nothing else belongs in this file.
#
# Quarkus MERGES src/main/resources/application.properties into the test config — it is not shadowed
# by this file. So every app-level setting (the application name, the persistence unit, the flyway
# location, the pack limit) is already in effect here and must NOT be re-declared: a test copy that
# drifts from the shipped copy makes the suite pass on a value the packaged process never sees.
# Only put a key here when the test genuinely needs a DIFFERENT value, and say why.

# BOTH datasources run against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky, never a container. Their ports are chosen at run time, so no url/username/password is
# written here at all: EmbeddedPgConfigSource supplies six values at an ordinal above this file, one
# database per datasource. clean-at-start wipes each schema between Quarkus restarts, which is what
# keeps a suite sharing one database across classes reproducible.
#
# The second lineage is the outbox's, and it needs a database even though the bus is DARK in %test:
# `qits.eventstream.enabled=false` stops publishing, sweeping and dialling, not the datasource —
# Quarkus opens the connection and migrates at boot regardless.
quarkus.flyway.githost.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true

# THE DATABASE PATIENCE, SHORTENED — the reads' and the writes' alike, since both seams read this
# one key. The shipped 15s is sized for a postgres cutover; a test that proves the give-up would
# wait all of it out, and one that proves the recovery pays a single 500ms pause either way. Short
# enough that the deadline expires on the second attempt.
qits.githost.db-retry-deadline=PT0.3S

# NO DEV SERVICES. The first rule here is that a clone tests green with no docker, and a dev service
# is a container start — which is exactly what an unconfigured postgres datasource invites. The
# config source above always gives both of them a url, so nothing should ask; this line is what
# makes "should" into "cannot".
quarkus.devservices.enabled=false

# A FREE port, not Quarkus' default test port 8081. On the deployment host 8081 is the address the
# platform's own npm registry answers on, so on the one machine this service is most likely to be
# built on the default is already bound and the whole suite dies with "Port already bound: 8081",
# which reads like a code failure and is not one. Even where it is free, @QuarkusTest restarts race
# each other for it.
quarkus.http.test-port=0

# Most route tests exercise Git semantics rather than authentication. Production's path policy is
# tested separately; keep these fixtures focused by replacing its policy in the test profile.
quarkus.http.auth.permission.git.policy=permit

# Keep blob bytes under target/, never the real ~/.qits home the shipped config points at. Packs,
# pack indexes and reftables are blobs in that same store, so this covers every byte the suite
# writes.
qits.artifacts.blobs-dir=target/githost-test-blobs

# NOTHING SWEEPS THE OUTBOX BEHIND A TEST. The bus is dark in %test, so the sweeper has nothing to
# do in most classes; ScmEventPublishTest turns the bus back on for itself against a CLOSED PORT, so
# every publish lands in the outbox and can be asserted on. Disabling the scheduler is what keeps a
# tick from retrying — and clearing — a row the test is about to read.
quarkus.scheduler.enabled=false
qits.eventstream.catchup-at-startup=false

# qits.projects.name-resolver-url stays UNSET here on purpose — not even a closed port. The suite's
# resolver is FakeRepositoryNameResolver, which overrides the shipped @DefaultBean adapter, so
# nothing under @QuarkusTest reads this key; leaving it unset is also what keeps the packaged
# process's own "no resolver configured" path the one the suite runs. The HTTP adapter is proved
# against its own in-process stub by HttpRepositoryNameResolverTest, outside CDI.

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
