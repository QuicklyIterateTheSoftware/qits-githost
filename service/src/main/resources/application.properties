# qits-githost — the platform's git smart-HTTP host.
#
# This module is the deployable, so this file is read at ordinal 250: it is the app's own settings.
# The library jars ship their defaults at ordinal 100 in META-INF/microprofile-config.properties
# (qits-blobstore: the blob datasource, the grace period and the staging TTL; qits-eventstream: the
# bus url, the outbox's datasource and lineage, the retry budget). Anything restated here is because
# THIS service owns the decision, not because the default was wrong. A deployment still overrides
# any of it by env.

quarkus.application.name=qits-githost

# --- the four surfaces, and where each of them sits -----------------------------------------------
# THIS SERVICE HAS A HOST OF ITS OWN, githost.<env>.<domain>, and both planes land on it. The
# browser gets the client at the root; git gets /git on the same authority, which is the name every
# clone url already spells. /githost stays this service's machine segment and is path-routed on every
# host, so the client's own calls work wherever a reader is. So:
#
#   /              the Angular client (Quinoa, see the web UI block below)
#   /githost/api   JAX-RS, this key
#   /githost/q     Quarkus' own non-application root: health, and nothing else here
#   /git/**        the git wire protocol, a literal in GitHostRoutes
#
# THE GIT ROUTES FOLLOW NEITHER KEY and cannot: they are plain Vert.x routes whose prefix is a
# literal, because git treats the base as opaque and appends /info/refs and the two pack verbs
# itself. No config key can move them, and moving them would be a cutover of every clone url on the
# platform.
quarkus.rest.path=/githost/api

# The framework's own surface rather than application code. It sits OUTSIDE quarkus.rest.path and
# moves only with this key, so anything left at the root /q would be unreachable through the
# path-routing edge.
#
# IT WAS /git/q AND MOVED WITH THE SEGMENT. The health gate in .config/qits/deployments.yml names
# the new path, and so does the anonymous health permission below; the three are one edit. That
# permission was left behind at the old /git/q for the whole life of this repository — a stale rule
# guarding nothing, since /githost/q was never inside the git policy either. Corrected here.
quarkus.http.non-application-root-path=/githost/q

# --- the web UI -----------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-spa-githost submodule, an Angular SPA) during augmentation
# and serves the output as static resources, from this same process and this same port.
#
# THE CLIENT IS SERVED AT THE ROOT, because this service has a host of its own —
# githost.<env>.<domain>. That is the same authority git clients already dial: the edge picks the
# gate per request, so a browser gets the page at / and git gets /git on the very same name. The API
# and health keep their segment and are path-routed on every host.
#
# ui-root-path is now `/` and the client's angular.json says baseHref "/", so the two still agree —
# Quinoa mounts the files, the baseHref is what makes index.html ask for them at the right url, and a
# mismatch serves a page whose every asset 404s. The old bare-/githost trailing-slash wart (upstream
# quinoa #960) went with the move: there is no bare segment for a reader to mistype any more.
quarkus.quinoa.ui-root-path=/

# Deep links: <anything the SPA routes> has no file behind it, so without this a reload or a pasted
# link 404s and only the entry page works.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa detects Angular and derives the same dist/<project>/browser from
# angular.json, but it derives it from a project NAME — pinning it means a rename over there fails
# THIS build loudly ("Quinoa build directory not found") instead of resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-spa-githost/browser

# What SPA routing must NOT swallow. The fallback is a catch-all under ui-root-path, so a request
# there that matches no file is answered with index.html — 200 text/html, which a machine client
# parses as data. The correct answer to a mistyped machine path is a 404.
#
# THE VALUES ARE ABSOLUTE NOW, and that is the whole change. Entries are matched after ui-root-path
# is stripped, and the ui root is `/`, so nothing is stripped: every entry is the real path. The old
# relative spelling would name nothing.
#
# THE GIT ROOTS ARE INSIDE THE FALLBACK'S REACH FOR THE FIRST TIME, which is why they are listed.
# Quinoa registers the fallback as ONE route, `uiRootPath + "*"` — now /* — so a mistyped /git/…
# would come back as the page without an entry, and a git client would read a web page as a ref
# advertisement. Matching is by path SEGMENT, so one /githost entry covers /githost/api
# (quarkus.rest.path) and /githost/q (quarkus.http.non-application-root-path) alike.
#
#   /githost        the segment: the API and health
#   /git            the git smart-HTTP wire protocol, a literal in GitHostRoutes
#   /bootstrap-git  the cold-boot ingress rewrite of the same protocol (off by default, see below)
#
# The segment is spelled in three keys of this file — quarkus.rest.path,
# quarkus.http.non-application-root-path and this one — plus `routes:` in .config/qits/deployments.yml.
# The client no longer spells it at all. Add a literal route and its entry here IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/githost,/git,/bootstrap-git

# Git is implemented as raw Vert.x routes, so Jakarta annotations cannot guard it. The HTTP policy
# covers the protocol root and every repository route before their handlers run. Browser/session
# callers carry qits:admin through the trusted forwarded headers; service clients carry qits:system
# in their validated bearer. Health is the deliberately anonymous, more-specific exception.
quarkus.http.auth.policy.git.roles-allowed=qits:admin,qits:system,qits:git:external
quarkus.http.auth.permission.git.paths=/git,/git/*
quarkus.http.auth.permission.git.policy=git

# The browser plane's content reads (RepositoryBrowseResource): tree listings and file contents for
# the SPA's Code pages. Gated like the /git content reads — these paths serve file CONTENTS, unlike
# the catalogue at /githost/api/repositories itself, which stays anonymous because it answers only
# opaque ids. Browser sessions carry qits:admin through the forwarded headers; qits-auth-core's
# %dev/%test synthetic identity is what keeps quarkus:dev and the suite passing this with no setup.
quarkus.http.auth.policy.githost-browse.roles-allowed=qits:admin,qits:system
quarkus.http.auth.permission.githost-browse.paths=/githost/api/repositories/*
quarkus.http.auth.permission.githost-browse.policy=githost-browse
# The wildcard above also covers the collection path itself (measured: without this entry the
# anonymous catalogue read answered 401), so the catalogue's standing contract — ids are not
# contents, and the SPA reads them before any session exists — is restated as the more specific
# match, which wins.
quarkus.http.auth.permission.githost-catalogue.paths=/githost/api/repositories
quarkus.http.auth.permission.githost-catalogue.policy=permit
# Health is at /githost/q, where quarkus.http.non-application-root-path puts it.
quarkus.http.auth.permission.health.paths=/githost/q,/githost/q/*
quarkus.http.auth.permission.health.policy=permit

# A cold bootstrap may run a disposable ingress before the normal edge exists.  It rewrites its
# public /git/** request onto /bootstrap-git/** and presents a per-run opaque capability.  Disabled
# by default, absent from deployment extras, and deliberately separate from OIDC/system authority.
quarkus.http.auth.permission.bootstrap-git.paths=/bootstrap-git,/bootstrap-git/*
quarkus.http.auth.permission.bootstrap-git.policy=permit
qits.bootstrap.ingress.git.enabled=false
qits.bootstrap.ingress.git.secret-hash=disabled
qits.bootstrap.ingress.git.repository=disabled
qits.bootstrap.ingress.git.ref-pattern=refs/heads/disabled
qits.bootstrap.ingress.git.expires-at=1970-01-01T00:00:00Z

qits.auth.machine.required=true
qits.auth.machine.audience=${QITS_AUTH_MACHINE_AUDIENCE}
quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks
quarkus.oidc.token.audience=${qits.auth.machine.audience}
# On a cold boot this service races idp's own start — the fleet-wide pair the siblings carry
# (qits-artifacts et al.), previously missing here. 30S of connection-delay turns the single boot
# JWKS attempt into a retried one; on window expiry a WARN is logged, startup continues, and key
# fetching falls back to lazy-on-first-request, so idp is not a hard dependency. The 5S refresh
# floor lets a token minted right after an idp key rotation force one re-fetch instead of failing
# until the next scheduled refresh. TokenValidationBootstrapIT is what pins the startup fetch.
quarkus.oidc.connection-delay=30S
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S
%dev.qits.auth.machine.required=false
%dev.quarkus.oidc.tenant-enabled=false
%test.qits.auth.machine.required=false
%test.quarkus.oidc.tenant-enabled=false

# --- the store ----------------------------------------------------------------------------------
# This service owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing qits-artifacts' or anyone else's. The three tables are the pack catalog
# and the protection override; see db/githost/migration/V1__githost_baseline.sql.
#
# WHERE THE DATABASE COMES FROM. qits-deployments creates the role and the database on the tier's
# postgres before the successor container starts and injects the platform's generic resource
# contract — QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — into it. Nothing about those names is
# githost-specific, which is the point: the application maps them in its own config and the deployer
# stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant.
quarkus.datasource.githost.db-kind=postgresql
quarkus.datasource.githost.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.githost.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.githost.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# THREE LINES, AND ALL THREE OR NONE — the platform's datasource baseline, asserted by
# DatasourceBaselineTest. PatientPgDriver delegates to org.postgresql.Driver and, when the database
# is not there, keeps asking for up to 14s instead of failing at once (SQLState 08* and 57P03 only;
# a wrong password still fails on the first attempt). Its deadline sits under the acquisition
# timeout so a caller gets the database's real refusal, not a generic pool message, and
# validate-on-borrow is what turns a dead pooled connection into the fresh creation attempt the
# driver makes patient. The url stays a plain jdbc:postgresql: one. See
# docs/project-setup-quinoa-angular.md and db-patience-plan.md for the measurements.
quarkus.datasource.githost.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.githost.jdbc.acquisition-timeout=15S
quarkus.datasource.githost.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to it. `packages` assigns entity→PU unambiguously, and it names
# ONLY the git host's own entities: the qits-blobstore jar carries entities of its own
# (eu.wohlben.qits.blobstore.entity, the artifact repository and record tables) that this service
# has no rows for and never queries, so they are deliberately left out of the unit rather than
# mapped onto tables this schema does not create.
quarkus.hibernate-orm.githost.datasource=githost
quarkus.hibernate-orm.githost.packages=eu.wohlben.qits.githost.persistence

# Own Flyway lineage at a classpath location named after the context. V1 is a fresh baseline holding
# the three tables that were V4 and V5 of qits-platform-artifacts' chain — a lineage is owned by a
# service, and this service is new.
#
# baseline-on-migrate is deliberately absent. Every database this lineage meets is either empty or
# was created by this lineage, so the flag would only mask the one case worth failing on — a schema
# somebody else put there.
quarkus.flyway.githost.migrate-at-start=true
quarkus.flyway.githost.locations=classpath:db/githost/migration

# Where a repository's bytes live: nowhere as a directory, and now nowhere on a disk either. Packs,
# pack indexes and reftables are content-addressed blobs in the three tables V2 creates, on the same
# datasource as the git_pack / git_pack_file rows that index them. The key names which of this
# service's datasources reaches them; the blobstore jar defaults it to `<default>`, which this
# service does not have.
#
# ONE DATASOURCE FOR BOTH IS THE POINT. A pack's bytes and the row that names it commit or fail
# together, so the split-brain the old blobs-dir invited — a pack file whose row did not survive, or
# a row whose file did not — cannot happen. It also makes the container stateless: nothing outside
# the database survives a restart.
qits.artifacts.blobs-datasource=githost

# --- the platform event bus ---------------------------------------------------------------------
# A push publishes SCMPublishCommit, SCMPublishTag, SCMDeleteBranch and SCMDeleteTag through the
# qits-eventstream outbox (bus/ScmEventAnnouncer; the vocabulary is the githost-events jar). It is
# the replacement for the post-receive HTTP fan-out, which retried in memory for three minutes and
# then lost the event — twice, on this platform, both times during a consumer's redeploy.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the outbox's own datasource
# (QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD) and Flyway lineage, the publish timeout and
# the retry budget all ship as defaults in that jar at ordinal 100. A copy in this file would be a
# second place to change and a silent way for the two to drift.
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable owns
# where it is real. A clone-alone `./mvnw verify` and a `quarkus:dev` have no qits-events on the far
# side, and enabled, every push would pay the publish timeout dialling an unresolvable host and
# leave outbox rows behind for the sweeper. A test that wants the bus turns it back on for itself.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- what a deployment MUST decide --------------------------------------------------------------
#   qits.projects.name-resolver-url
#                         Where qits-projects turns (projectId, repoName) into a repo id, which is
#                         what makes /git/:projectId/:repoName serve. THAT IS THE PUBLIC CLONE URL —
#                         CI, the daemons, deploy pushes and humans all address repositories that
#                         way, and it is what makes a committed relative submodule url
#                         (../<name>.git) resolve natively — so a real deployment sets this key or
#                         serves nothing anyone can clone. NO DEFAULT and none possible: unset means
#                         the name-addressed scheme 404s and only the internal id-addressed one
#                         serves, while a guessed host would turn every clone into a five-second
#                         wait for the same 404. In production:
#                         QITS_PROJECTS_NAME_RESOLVER_URL=http://<env>-qits-projects:8080/projects/api/projects
#
#                         A MISS AND AN OUTAGE ARE DIFFERENT ANSWERS. qits-projects' 404 is "no such
#                         name" and reaches the git client as a 404; anything that stopped the
#                         question being answered — timeout, refused connection, non-200 — is a 503,
#                         because a client caches a 404 as "this repository is gone" (fe26a6c).
#
#   qits.githost.storage-client
#                         The client id whose SELF-ROLE (clients/<value>, minted by qits-idp into
#                         every bearer that client gets) opens the ID-ADDRESSED scheme: smart-HTTP,
#                         the lifecycle PUT/GET/HEAD, GET /git and the id-addressed content reads.
#                         Set it to qits-projects' service client and NOTHING ELSE opens those
#                         routes — not qits:admin, not qits:system — because /git/<repoId> is
#                         internal storage plumbing and a caller holding a UUID clone url is a
#                         defect. UNSET (the shipped default) is the compat arm: the scheme behaves
#                         exactly as it always did. Optional, never a String: a configured-empty
#                         value reads as absent to SmallRye and a String injection would kill the
#                         boot.
#
#   qits.repositories.git.push-token
#                         The escape hatch for the protected default branch, and it has NO default:
#                         unset means no `-o qits.token=<value>` matches, and a configured-empty
#                         value matches nothing either. With protection on and no token configured
#                         there is no way to push the default branch directly at all.

# --- the git host's pack limit -------------------------------------------------------------------
# GitHostRoutes buffers the pack into memory through a BodyHandler, so it needs its own, lower
# number than the global wire ceiling. It also cannot be left implicit: BodyHandler.create() is not
# unlimited — vertx-web's BodyHandlerImpl defaults bodyLimit to 10 MiB — so before this property
# existed every push over 10 MB was silently 413'd.
qits.repositories.git.max-pack-size=64M

# The global wire ceiling, sized just above the pack limit. In qits-artifacts this was 1088M because
# an OCI layer shared the process; nothing here streams a gigabyte, and a ceiling far above what any
# route accepts is only a wider door on a deliberately unauthenticated service.
quarkus.http.limits.max-body-size=128M

# --- the default branch's seatbelt (see githost/ProtectedRefHook) ---------------------------------
# Whether a direct update or delete of a repository's default branch (its HEAD) is refused. Creates
# are always allowed — an empty repo has no default branch to protect.
#
# FALSE in the shipped defaults, and that is not timidity: this service is the git host that serves
# its own redeploy, so a protection bug that landed enabled could reject the very push that fixes
# it. A deployment turns it on by env (QITS_REPOSITORIES_GIT_PROTECT_DEFAULT_BRANCH=true); a single
# repository overrides it with a row in git_repository_protection.
qits.repositories.git.protect-default-branch=false

# --- long pushes on a worker thread ---------------------------------------------------------------
# Vert.x' BlockedThreadChecker logs a warning WITH A FULL STACK TRACE whenever an executeBlocking
# task outruns quarkus.vertx.max-worker-execute-time, which defaults to 60 seconds. It aborts
# nothing — but a clone of a large repository holds its worker for as long as the client is
# receiving, so the default turns every big clone into a wall of stack traces that buries real
# warnings. ISO-8601 rather than a bare number, which Quarkus reads as seconds.
quarkus.vertx.max-worker-execute-time=PT30M

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-githost` rather than qits-githost-service-<version>-runner, so the
# process is identifiable in `ps` / `docker top`.
quarkus.package.output-name=qits-githost
quarkus.package.jar.add-runner-suffix=false

# --- telling native-image about JGit ------------------------------------------------------------
# JGit is NOT a Quarkus extension: nothing registers its reflection, its ServiceLoader providers or
# its resources on its behalf, and every one of these gaps fails at RUNTIME in the binary while the
# @QuarkusTest suite stays green.
#
# All four are JGit statics that native-image refuses to freeze into the image heap, and all four
# sit on the path a git request takes:
#
#   util.FileUtils          a static java.util.Random (retry jitter in delay()). A build-time
#                           instance carries a fixed seed: "Detected an instance of
#                           Random/SplittableRandom class in the image heap".
#   lib.internal.WorkQueue  a static ScheduledThreadPoolExecutor, already running by the time the
#                           class initialiser finishes: "Detected a started Thread in the image
#                           heap. Thread name: JGit-WorkQueue".
#   ...file.WindowCache     another static java.util.Random, the eviction jitter of the mmap window
#                           cache — reached from RefAdvertiser.send, so it is on the info/refs path.
#   ...dfs.DfsBlockCache    the analogue of WindowCache on the storage this host actually serves,
#                           reached from the first object read of a repository.
#
# WindowCache stays although no repository is file-backed: UploadPack/ReceivePack pull JGit's
# file-storage classes in regardless, and the failure mode if that is wrong is a silent 404 on every
# git route in the binary.
quarkus.native.additional-build-args=--initialize-at-run-time=org.eclipse.jgit.util.FileUtils,--initialize-at-run-time=org.eclipse.jgit.lib.internal.WorkQueue,--initialize-at-run-time=org.eclipse.jgit.internal.storage.file.WindowCache,--initialize-at-run-time=org.eclipse.jgit.internal.storage.dfs.DfsBlockCache

# --- telemetry ----------------------------------------------------------------------------------
# One key names the receiver: scheme, host and port, NO path. The ingest path is qits-observability's
# own and belongs to the service, so it is spelled once and derived rather than configured.
qits.observability.url=http://qits-observability:8080
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs and metrics ride the same exporter; traces are on by default. The three log keys are spelled
# out although two of them are Quarkus' own defaults: the integration is still labelled PREVIEW, so
# an upgrade that changed a default would stop this service's logging with a green build and no
# error anywhere. Written down, a change of default is a diff rather than a silence.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
