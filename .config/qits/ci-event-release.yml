# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION. qits-platform-dns' file, name for name — see that repository for the long form of
# each rule; the short form of the ones that bite:
#
# - The selection naming this repository is not a loop: SCMRelease comes from qits-workspaces, and
#   nothing in this file publishes it.
# - `artifacts:` is a declaration, not a report — qits-ci announces on the strength of it. Keep it
#   true.
# - The name is unqualified on purpose; the reader supplies its own registry host.
# - The build below is ci-event-build.yml's, and the two must stay matched: one image content, two
#   coordinates. That includes --network and --build-arg, which this repository needs because
#   qits-eventstream lives only in the platform's own Maven repository, AND the whole first half —
#   the webui submodule fetch, the lockfile origin swap and the `npm_config_*` environment. That
#   file is where each of those is explained at length; this one carries the short form rather than
#   a second copy of the reasoning to drift.
# - This file is inert until an SCMRelease for this repository exists, and it lands first on purpose
#   — the bus is at-most-once, so the trigger must precede the event it selects.
#
# WHAT IS NOT DECLARED HERE. This repository also publishes two library jars — qits-githost-events
# (the event vocabulary a consumer depends on) and qits-githost-git-storage — and neither is in
# `artifacts:` below, because this pipeline does not publish them. A Maven release of those jars is
# its own step and its own declaration, and announcing an artifact nothing pushed is exactly what
# `artifacts:` must never do.
event: SCMRelease
when:
  - repository: { exact: qits-githost }
artifacts:
  - { type: docker, name: qits/qits-githost }
steps:
    # node and npm build the client and read the event payload, which is JSON; git fetches the tag
    # and the webui submodule; the docker CLI builds and pushes.
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # Without -e a failed docker build is swallowed and a green release run makes qits-ci announce
      # an artifact that was never pushed. -u makes an unset registry variable stop the step.
      set -eu

      # The event, read as data: the payload reaches the container verbatim in $QITS_EVENT_PAYLOAD.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # A version here is a calver or a semver, and nothing legitimate needs a character outside
      # this set. Refused rather than quoted, because it reaches a shell and a docker reference.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-githost:$version"

      # The tag is the checkout target: an event-triggered run is cloned at the head of main, which
      # a later push moves — the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec; the URL rather than `origin` because every address a step needs arrives
      # as environment. `checkout --detach` peels the annotated tag to its commit — and it is what
      # makes the submodule fetch below land on the gitlink the RELEASE recorded rather than on
      # main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so qits-spa-githost arrives as an empty
      # directory and Quinoa's client never gets built — the Dockerfile's `test -f` guard is what
      # turns that into a red build instead of an image with no page. See ci-event-build.yml for
      # why the lockfile origins are rewritten and why the registry is passed as environment rather
      # than as a file: that repo's committed .npmrc outranks any ~/.npmrc this step could write.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-githost"
      git -c submodule.qits-spa-githost.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's) gets the hosted origin and
      # everything else gets the proxy's, and the broad expression has to run before the narrow one.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN. Unconditional on purpose: a missing env
      # source is NOT an error — measured on buildx v0.36.1, `--secret id=x,env=DOES_NOT_EXIST`
      # builds green and the mounted variable is simply unset — so this is inert until a run carries
      # the pair. ci-event-build.yml carries the same two flags, and the two must stay matched.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-githost:$version"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving, which is the
      # race that broke the release of 2026-08-11.
