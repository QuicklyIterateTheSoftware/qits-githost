# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION. qits-platform-dns' file, name for name — see that repository for the long form of
# each rule; the short form of the ones that bite:
#
# - The selection naming this repository is not a loop: SCMRelease comes from qits-projects' Auto
#   Release, and nothing in this file publishes it.
# - `artifacts:` is a declaration, not a report — qits-ci announces on the strength of it. Keep it
#   true.
# - The name is unqualified on purpose; the reader supplies its own registry host.
# - The build below is ci-event-release-request.yml's gating step, and the two must stay matched:
#   the QA pipeline proves a release request's fold with this same build, minus the push. That
#   includes --network and --build-arg, which this repository needs because
#   qits-eventstream lives only in the platform's own Maven repository, AND the whole first half —
#   the webui submodule fetch, the lockfile origin swap and the `npm_config_*` environment. That
#   file is where each of those is explained at length; this one carries the short form rather than
#   a second copy of the reasoning to drift.
# - This file is inert until an SCMRelease for this repository exists, and it lands first on purpose
#   — the bus is at-most-once, so the trigger must precede the event it selects.
#
# WHAT IS NOT DECLARED HERE. This repository also publishes two library jars — qits-githost-events
# (the event vocabulary a consumer depends on) and qits-githost-git-storage — and neither is in
# `artifacts:` below, because this pipeline does not publish them. A Maven release of those jars is
# its own step and its own declaration, and announcing an artifact nothing pushed is exactly what
# `artifacts:` must never do.
event: SCMRelease
when:
  - repository: { exact: qits-githost-service }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-githost }
steps:
    # node and npm build the client and read the event payload, which is JSON; git fetches the tag
    # and the webui submodule; the docker CLI builds and pushes.
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # Without -e a failed docker build is swallowed and a green release run makes qits-ci announce
      # an artifact that was never pushed. -u makes an unset registry variable stop the step.
      set -eu

      # The event, read as data: the payload reaches the container verbatim in $QITS_EVENT_PAYLOAD.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # A version here is a calver or a semver, and nothing legitimate needs a character outside
      # this set. Refused rather than quoted, because it reaches a shell and a docker reference.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-githost:$version"

      # The tag is the checkout target: an event-triggered run is cloned at the head of main, which
      # a later push moves — the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec; the URL rather than `origin` because every address a step needs arrives
      # as environment. `checkout --detach` peels the annotated tag to its commit — and it is what
      # makes the submodule fetch below land on the gitlink the RELEASE recorded rather than on
      # main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so qits-githost-frontend arrives as an empty
      # directory and Quinoa's client never gets built — the Dockerfile's `test -f` guard is what
      # turns that into a red build instead of an image with no page. See ci-event-release-request.yml for
      # why the lockfile origins are rewritten and why the registry is passed as environment rather
      # than as a file: that repo's committed .npmrc outranks any ~/.npmrc this step could write.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-githost-frontend"
      git -c submodule.qits-githost-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's) gets the hosted origin and
      # everything else gets the proxy's, and the broad expression has to run before the narrow one.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN. Unconditional on purpose: a missing env
      # source is NOT an error — measured on buildx v0.36.1, `--secret id=x,env=DOES_NOT_EXIST`
      # builds green and the mounted variable is simply unset — so this is inert until a run carries
      # the pair. ci-event-release-request.yml carries the same two flags, and the two must stay matched.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-githost:$version"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving, which is the
      # race that broke the release of 2026-08-11.

      # --- the SBOM -----------------------------------------------------------------------------
      # AFTER THE PUSH, BEFORE THIS STEP EXITS GREEN, and that ordering is the whole guarantee:
      # qits-ci announces `SoftwareRelease` only for a green run, so no consumer is ever told about
      # a version whose bill of materials is missing. A failed PUT fails the release ON PURPOSE —
      # the store being down is not a reason to announce a version nobody can audit. Only THIS
      # pipeline uploads one; the QA pipeline's fold build pushes nothing, announces no release and
      # owes no document. And only for the image: the two library jars stay undeclared above, so nothing
      # here speaks for them either.
      #
      # The second `docker build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `--output` instead of pushed.
      # Args and secrets are BYTE-IDENTICAL to the image build above, which is what makes every
      # layer a cache hit and this export seconds rather than a second native compile; a drift
      # between the two invocations costs a full rebuild, not a wrong document.
      docker build --network host --target sbom --output type=local,dest=.sbom \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -f docker/Dockerfile .
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY: that is the host-published name the docker daemon pushes
      # through, and inside this container it answers curl with an instant connection refusal
      # (measured twice — the pushes above succeed through the daemon while the same host name is
      # unreachable from in here, and the edge 401s a sessionless write besides). The path names the
      # DECLARED artifact identity verbatim: `artifacts:` above says `{type: docker, name:
      # qits/qits-githost}`, and (packageType, packageName, version) is how the SoftwareRelease
      # consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-githost/-/$version"
